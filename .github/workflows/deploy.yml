name: Deploy BillShield to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Grant permissions required for GitHub Actions to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments from clashing
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project with Base Path
        run: npm run build -- --base=/BillShield/

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
